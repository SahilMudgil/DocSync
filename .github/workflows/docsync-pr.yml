name: DocSync Documentation Drift Check

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Select operating mode
        run: |
          if [ -n "${{ secrets.GOOGLE_API_KEY }}" ]; then
            echo "MODE=full" >> $GITHUB_ENV
          else
            echo "MODE=fast" >> $GITHUB_ENV
          fi

      - name: Run DocSync Drift Check
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          mkdir -p results
          python -m docsync.cli check \
            --repo . \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --mode $MODE \
            --out results/

      - name: Upload Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docsync-drift-report
          path: results/

      - name: Post PR Comment
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m docsync.cli comment --input results/latest.json --pr ${{ github.event.pull_request.number }}
